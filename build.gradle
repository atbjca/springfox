buildscript {
  repositories {
    mavenLocal()
    maven {
      url "https://plugins.gradle.org/m2/"
    }
    mavenCentral()
    if (project.hasProperty('nexusPublicUrl')) {
      maven {
        url nexusPublicUrl
        credentials {
          username nexusUsername
          password nexusPassword
        }
      }
    }
    jcenter()
  }

  dependencies {
    classpath "com.github.adrianbk:gradle-jvmsrc-plugin:0.6.1"
    classpath 'com.github.ben-manes:gradle-versions-plugin:0.20.0'
  }
}

plugins {
  id "net.ltgt.apt-idea" version "0.21"
}

apply from: "$rootDir/gradle/dependencies.gradle"
apply from: "$rootDir/gradle/security-verify.gradle"
apply from: "$rootDir/gradle/ide.gradle"
apply plugin: 'com.github.ben-manes.versions'
apply plugin: 'build-dashboard'
apply plugin: 'project-report'
// Disabled: springfox-multi-release depends on grgit (JCenter-exclusive), pending release plugin rewrite
//apply plugin: 'springfox-multi-release'

// Version read from .version file (replaces disabled springfox-multi-release plugin)
version = file(".version").text.trim()

ext {
  apiKey = System.getenv('GIT_HUB_API_KEY')
  jdkVersion = 1.8
}

allprojects {
  apply plugin: 'jacoco'
}

// Nexus publishing repository — auto-selects snapshot vs release based on version suffix
allprojects {
  plugins.withType(org.gradle.api.publish.maven.plugins.MavenPublishPlugin) {
    publishing {
      repositories {
        if (project.hasProperty('nexusReleaseUrl')) {
          maven {
            url = project.provider {
              project.version.toString().endsWith('-SNAPSHOT') ? nexusSnapshotUrl : nexusReleaseUrl
            }
            credentials {
              username nexusUsername
              password nexusPassword
            }
          }
        }
      }
    }
  }
}

subprojects {
  //Not strictly groovy projects but useful for the IDE to recognise groovy test sources
  apply plugin: 'groovy' //gradle groovy plugin extends the java plugin
  apply plugin: 'com.github.adrianbk.jvmsrc'
  apply plugin: 'checkstyle'

  javadoc {
    options.encoding = 'UTF-8'
  }

  tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.deprecation = true
    options.compilerArgs += ["-Xlint:unchecked", "-Xlint:deprecation", "-parameters"]
  }

  //Commented PMD and Findbugs as its taking too much time for very little value
  //Perhaps run every 20 CI builds (mod of ci build number)
//  apply from: "$rootDir/gradle/code-quality.gradle"
  if (springfox.gradlebuild.utils.ProjectDefinitions.publishable(it)) {
    apply from: "$rootDir/gradle/publishing.gradle"
  }
  repositories {
    mavenLocal()
    if (project.hasProperty('nexusPublicUrl')) {
      maven {
        url nexusPublicUrl
        credentials {
          username nexusUsername
          password nexusPassword
        }
      }
    }
    if (project.hasProperty('nexusSnapshotUrl') && project.version.toString().endsWith('-SNAPSHOT')) {
      maven {
        url nexusSnapshotUrl
        credentials {
          username nexusUsername
          password nexusPassword
        }
      }
    }
    mavenCentral()
    jcenter()
  }

  checkstyle {
    configFile = file("$rootDir/config/checkstyle.xml")
  }

  checkstyleMain.source = "src/main/java"

  test {
    maxParallelForks = 2
  }

  configurations {
    provided
    compile.extendsFrom provided
  }

  jvmsrc {
    packageName "springfox"
  }

  sourceCompatibility = jdkVersion
  targetCompatibility = jdkVersion
  group = projectGroup
  version = project.rootProject.version

  task allDeps(type: DependencyReportTask) {}

  jacoco {
    toolVersion = "$jacocoVersion"
  }

  jacocoTestReport {
    reports {
      xml.enabled true
      html.enabled true
    }
  }

  test {
    jvmArgs "-Dorg.spockframework.mock.ignoreByteBuddy=true"
  }
}

// Disabled: docs build depends on asciidoctor + git-publish plugins (JCenter-exclusive)
//apply from: "$rootDir/gradle/documentation.gradle"

// Disabled: wrapper version was incorrect (stated 4.10.1, actual is 5.2)
//wrapper {
//  gradleVersion = '4.10.1'
//}

task codeCoverageReport(type: JacocoReport) {

  // Gather execution data from all subprojects
  // (change this if you e.g. want to calculate unit test/integration test coverage separately)
  executionData fileTree(project.rootDir.absolutePath).include("**/build/jacoco/*.exec")

  // Add all relevant sourcesets from the subprojects
  subprojects.each { sourceSets it.sourceSets.main }

  reports {
    xml.enabled true
    xml.destination file("${buildDir}/reports/jacoco/report.xml")
    html.enabled false
    csv.enabled false
  }
}

// always run the tests before generating the report
codeCoverageReport.dependsOn {
  subprojects*.test
}